# Render Blueprint for the Stochastix API + dashboard.
#   Render -> New -> Blueprint -> point at this repo.
# Models/forecasts/price cache ship in the repo (refreshed weekly by the
# retrain PR), so no persistent disk is needed; merging that PR auto-deploys.
services:
  - type: web
    name: stochastix-api
    runtime: python
    plan: free
    buildCommand: pip install -e . -c constraints.txt
    startCommand: uvicorn stockforge.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: STOCKFORGE_LOG_LEVEL
        value: INFO
      - key: STOCKFORGE_API_KEY
        sync: false

  - type: web
    name: stochastix-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -e ".[dashboard]" -c constraints.txt
    startCommand: streamlit run src/stockforge/dashboard/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless=true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
