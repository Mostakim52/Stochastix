# Render Blueprint for the Stochastix API + dashboard.
#   Render -> New -> Blueprint -> point at this repo.
services:
  - type: web
    name: stochastix-api
    runtime: python
    plan: starter
    buildCommand: pip install -e .
    startCommand: uvicorn stockforge.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: STOCKFORGE_LOG_LEVEL
        value: INFO
      - key: STOCKFORGE_API_KEY
        sync: false
    disk:
      name: model-artifacts
      mountPath: /opt/render/project/src/artifacts
      sizeGB: 1

  - type: web
    name: stochastix-dashboard
    runtime: python
    plan: starter
    buildCommand: pip install -e ".[dashboard]"
    startCommand: streamlit run src/stockforge/dashboard/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless=true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
