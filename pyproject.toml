[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stochastix"
version = "1.0.0"
description = "AI stock price forecaster with walk-forward ML models, Black-Litterman portfolio optimization, backtesting, and production serving."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Stochastix Contributors" }]
requires-python = ">=3.11,<3.14"
keywords = ["stocks", "forecasting", "machine-learning", "portfolio-optimization", "fintech"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "yfinance>=0.2.40",
    "joblib>=1.3",
    "pyarrow>=15",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.33", "plotly>=5.20"]
deep = ["torch>=2.2"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.6",
]

[project.scripts]
stochastix = "stockforge.cli:main"

[project.urls]
Homepage = "https://github.com/example/ai-stock-price-forecaster"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stochastix = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = [".venv", "artifacts", "data/cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["build", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running integration tests",
]

[tool.coverage.run]
source = ["src/stockforge"]
