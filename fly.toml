# Fly.io deployment for the Stochastix API.
#
#   fly launch --no-deploy
#   fly secrets set STOCKFORGE_API_KEY=...
#   fly deploy
#
app = "stochastix-api"
primary_region = "iad"

[build]
dockerfile = "docker/Dockerfile"

[env]
STOCKFORGE_LOG_LEVEL = "INFO"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = "suspend"
auto_start_machines = true
min_machines_running = 1

[http_service.checks]
[http_service.checks.health]
path = "/health"
interval = "30s"
timeout = "5s"
grace_period = "15s"

[[vm]]
size = "shared-cpu-1x"
memory = "1gb"
